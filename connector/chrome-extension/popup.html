<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #1c1c1e;
        color: #f2f2f7;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 110px;
        background: #2c2c2e;
        color: #f2f2f7;
        border: 1px solid #3a3a3c;
        border-radius: 8px;
        padding: 8px;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        resize: vertical;
      }
      .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
        background: #3a3a3c;
        color: #f2f2f7;
        white-space: nowrap;
      }
      button.primary { background: #0a84ff; color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      #summary {
        margin-top: 10px;
        padding: 8px 10px;
        background: #2c2c2e;
        border-radius: 8px;
        display: none;
      }
      #summary .t { font-weight: 600; }
      #status { margin-top: 10px; min-height: 18px; }
      #status.err { color: #ff453a; }
      #status.ok { color: #34c759; }
      .hint { color: #8e8e93; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Peerventory Listing Connector</h1>
    <textarea
      id="payload"
      placeholder='Paste the listing payload here (Sell / export listing → "Copy for extension" in the app)'
    ></textarea>
    <div class="row">
      <button id="read-clipboard">Read clipboard</button>
      <button id="save">Save payload</button>
    </div>
    <div id="summary">
      <div class="t" id="summary-title"></div>
      <div id="summary-price"></div>
      <div id="summary-photos"></div>
    </div>
    <div class="row">
      <button id="fill" class="primary">Fill this page</button>
      <button id="clear">Clear</button>
    </div>
    <div id="status"></div>
    <p class="hint">
      Works on the Anibis publish form and the Facebook Marketplace “Create listing” form. Photos:
      download them from the app, then drag the files into the form yourself — Chrome does not let
      extensions attach files.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
