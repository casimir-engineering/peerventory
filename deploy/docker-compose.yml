services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    init: true
    environment:
      NODE_ENV: production
      PORT: "8787"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    expose:
      - "8787"
    volumes:
      - server_data:/app/server/data
      - ../app/dist:/app/app/dist:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    depends_on:
      server:
        condition: service_healthy
    environment:
      INVENTORY_HOST: ${INVENTORY_HOST:?Set INVENTORY_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app/dist:/srv:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  server_data:
  caddy_data:
